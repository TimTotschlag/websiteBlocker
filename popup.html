<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Blocker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="popup">
  <header>
    <h1>Website Blocker</h1>
  </header>

  <form id="add-form">
    <input
      type="text"
      id="site-input"
      placeholder="e.g. facebook.com"
      autocomplete="off"
      spellcheck="false"
    />
    <button type="submit">Add</button>
  </form>
  <p class="hint" id="message"></p>

  <ul id="site-list" class="site-list"></ul>
  <p class="empty" id="empty-state">No blocked sites yet. Add one above.</p>

  <script src="popup.js"></script>
</body>
</html>
