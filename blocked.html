<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Blocked</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #fff;
      text-align: center;
    }
    .card {
      max-width: 480px;
      padding: 40px;
    }
    .emoji {
      font-size: 64px;
    }
    h1 {
      margin: 16px 0 8px;
      font-size: 28px;
    }
    p {
      margin: 8px 0;
      font-size: 16px;
      opacity: 0.9;
    }
    .site {
      font-weight: 700;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🚫</div>
    <h1>This site is blocked</h1>
    <p class="site" id="site"></p>
    <p>You added this website to your block list in Website Blocker.</p>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
